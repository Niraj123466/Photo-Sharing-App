version: "3.8"

services:
  # Local PostgreSQL for development
  # Production uses Neon PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: framevault-postgres
    environment:
      POSTGRES_USER: framevault
      POSTGRES_PASSWORD: framevault_local
      POSTGRES_DB: framevault
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U framevault"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO for local S3-compatible storage
  minio:
    image: minio/minio:latest
    container_name: framevault-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # Automatically create bucket on startup
  create-bucket:
    image: minio/mc:latest
    container_name: framevault-create-bucket
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set localminio http://minio:9000 minioadmin minioadmin123); do echo 'Waiting for MinIO...'; sleep 1; done;
      /usr/bin/mc mb localminio/framevault-photos --ignore-existing;
      /usr/bin/mc anonymous set download localminio/framevault-photos;
      exit 0;
      "

volumes:
  postgres_data:
  minio_data:
